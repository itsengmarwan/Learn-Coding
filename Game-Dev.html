<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Development Track</title>
    <link rel="stylesheet" href="Dev-Style.css" />
    <link rel="icon" href="picture/logo.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </head>
  <body>
    <header>
      <a href="./index.html" class="logo">LEARN <span>CODING</span></a>
      <div class="nav-links">
        <a href="./index.html" class="nav-btn"><i class="fas fa-home"></i> Home</a>
        <div class="theme-switch" id="theme-toggle"><i class="fas fa-moon"></i></div>
      </div>
    </header>

    <section class="projects">
      <h2 class="title">Game Development</h2>
      <p class="subtitle">Master Unity & C# from scratch to professional level</p>

      <div class="steps-container">
        <div class="step-item"><i class="fas fa-download"></i> Install Unity Hub</div>
        <div class="step-item"><i class="fas fa-code"></i> Install VS Code</div>
        <div class="step-item"><i class="fas fa-book"></i> C# Basics</div>
      </div>

      <div class="content">
        <div class="project-card">
          <div class="project-image">
            <iframe src="https://www.youtube.com/embed/OGFHFvtCmkE" title="Video" allowfullscreen></iframe>
            <div class="video-label">1. Introduction to Unity Engine</div>
          </div>
        </div>
        <div class="project-card">
          <div class="project-image">
            <iframe src="https://www.youtube.com/embed/JeNM21S8HQ4" title="Video" allowfullscreen></iframe>
            <div class="video-label">2. Creating Your First Script</div>
          </div>
        </div>
      </div>
    </section>

    <script>
      const themeToggle = document.getElementById('theme-toggle');
      const icon = themeToggle.querySelector('i');
      const body = document.body;
      if(localStorage.getItem('theme') === 'light'){
          body.classList.add('light-mode');
          icon.classList.replace('fa-moon', 'fa-sun');
      }
      themeToggle.addEventListener('click', () => {
          body.classList.toggle('light-mode');
          if(body.classList.contains('light-mode')){
              icon.classList.replace('fa-moon', 'fa-sun');
              localStorage.setItem('theme', 'light');
          } else {
              icon.classList.replace('fa-sun', 'fa-moon');
              localStorage.setItem('theme', 'dark');
          }
      });
    </script>
  </body>
</html>
