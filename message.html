<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link rel="stylesheet" href="./message-style.css" />
    <link rel="icon" href="picture/logo.png" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </head>
  <body>
    <div class="background"></div>
    <div class="container">
      <div class="form-wrapper">
        <a href="./index.html" class="close-btn"><i class="fas fa-times"></i></a>
        <a href="./message.html?lang=ar" class="language-link" id="language-toggle">العربية</a>
        <h1>Get in Touch</h1>
        <p class="form-intro">Have a question? We'd love to hear from you.</p>
        <form target="_blank" action="https://formsubmit.co/marwan.tarek.abosalem@gmail.com" method="POST">
          <div class="input-group">
            <input id="name" type="text" name="name" placeholder=" " required />
            <label for="name">Full Name</label>
          </div>
          <div class="input-group">
            <input id="email" type="email" name="email" placeholder=" " required />
            <label for="email">Email Address</label>
          </div>
          <div class="input-group">
            <textarea id="message" name="message" rows="4" placeholder=" " required></textarea>
            <label for="message">Your Message</label>
          </div>
          <button type="submit" class="submit-btn">Send Message <i class="fas fa-paper-plane"></i></button>
        </form>
      </div>
    </div>
    <script src="./message.js"></script>
  </body>
</html>
