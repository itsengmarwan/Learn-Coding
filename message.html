<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Developer</title>
    <link rel="stylesheet" href="./message-style.css" />
    <link rel="icon" href="picture/logo.png" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="container">
      <div class="form-wrapper">
        <h1>Contact The Developer</h1>
        <p>Feel free to send a message regarding any inquiries.</p>
        
        <form target="_blank" action="https://formsubmit.co/marwan.tarek.abosalem@gmail.com" method="POST">
          <div class="input-group">
            <input type="text" name="name" placeholder="Full Name" required />
          </div>
          <div class="input-group">
            <input type="email" name="email" placeholder="Email Address" required />
          </div>
          <div class="input-group">
            <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
          </div>
          <button type="submit" class="submit-btn">Send Message</button>
        </form>
        
        <a href="./index.html" class="back-link">Back to Home</a>
      </div>
    </div>
  </body>
</html>
